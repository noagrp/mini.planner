<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>Mini Planner</title>
<link rel="manifest" href="./manifest.webmanifest?v=1">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png?v=1">
<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=1">
<style>
:root{--glass:rgba(255,255,255,.30);--ink:#1f2937;--muted:#5b6472;--accent:#7c3aed;--danger:#dc2626;--ok:#15803d}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;color:var(--ink);transition:background .6s ease;overflow-x:hidden}.spring{background:linear-gradient(135deg,#a8e063,#56ab2f)}.summer{background:linear-gradient(135deg,#f7d486,#f7971e)}.autumn{background:linear-gradient(135deg,#ff9966,#ff5e62)}.winter{background:linear-gradient(135deg,#83a4d4,#b6fbff)}
#effect-layer{position:fixed;inset:0;pointer-events:none;z-index:0}.particle{position:absolute;opacity:.55}.shining-ball{border-radius:50%;background:radial-gradient(circle,#fff,#ffd700);box-shadow:0 0 14px #ffeb3b}.shell{position:relative;z-index:1;width:min(94%,460px);margin:24px auto;padding-bottom:calc(28px + env(safe-area-inset-bottom))}.card{background:var(--glass);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 30px rgba(0,0,0,.16);border-radius:20px;padding:18px}.title{text-align:center;margin:0 0 14px;font-size:1.55rem}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:rgba(0,0,0,.16);padding:5px;border-radius:12px;margin-bottom:14px}.tab{border:0;border-radius:9px;padding:10px;font-weight:700;background:transparent;color:rgba(255,255,255,.75)}.tab.active{background:rgba(255,255,255,.92);color:#222}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input,select,button{width:100%;border:0;border-radius:10px;padding:12px;font:inherit}input,select{background:rgba(255,255,255,.9);color:#222}button{cursor:pointer;font-weight:700;background:rgba(0,0,0,.2);color:white}.primary{background:rgba(55,48,163,.78)}.secondary{background:rgba(255,255,255,.25)}.danger{background:rgba(220,38,38,.72)}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.list{margin-top:14px;display:grid;gap:9px}.task{background:rgba(0,0,0,.16);color:#fff;border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.task.overdue{border:2px solid rgba(220,38,38,.85);background:rgba(127,29,29,.26)}.task.due{animation:pulse 2s infinite;border:2px solid #fff}.task.completed{opacity:.72}.meta{font-size:.78rem;opacity:.82;margin-top:4px}.tag{display:inline-block;margin-top:5px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.2);font-size:.72rem;font-weight:700}.actions{display:flex;gap:5px}.icon{width:auto;padding:7px 8px;background:rgba(255,255,255,.18)}.empty{text-align:center;padding:18px;color:rgba(255,255,255,.8);font-size:.9rem}.hint{text-align:center;font-size:.76rem;color:rgba(20,20,20,.72);margin-top:12px}.edit-note{font-size:.75rem;text-align:center;margin:2px 0 10px;font-weight:700}.hidden{display:none!important}@keyframes pulse{50%{transform:scale(1.015);box-shadow:0 0 18px rgba(255,255,255,.8)}}
@media(max-width:390px){.shell{width:96%;margin-top:12px}.card{padding:14px}.form{grid-template-columns:1fr}.full{grid-column:auto}.toolbar{grid-template-columns:1fr}.task{grid-template-columns:1fr}.actions{justify-content:flex-end}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#effect-layer{display:none}}
</style>
</head>
<body id="body" class="spring">
<div id="effect-layer"></div>
<main class="shell"><section class="card">
<h1 class="title">Mini Planner</h1>
<div class="tabs"><button id="tabActive" class="tab active" onclick="switchTab('active')">📅 Active</button><button id="tabHistory" class="tab" onclick="switchTab('history')">✓ History</button></div>
<div id="editor">
<div id="editNote" class="edit-note hidden">Editing task</div>
<div class="form">
<input type="date" id="dateInput" onchange="updateSeason()">
<input type="time" id="timeInput">
<select id="categoryInput"><option value="Personal">🟢 Personal</option><option value="Work">🔴 Work</option><option value="Others">🔵 Others</option></select>
<input id="taskInput" type="text" placeholder="Add a task…" maxlength="160" onkeydown="if(event.key==='Enter'){event.preventDefault();saveTask()}">
<button class="primary full" id="saveBtn" onclick="saveTask()">Add Task</button>
<button class="secondary full hidden" id="cancelEditBtn" onclick="cancelEdit()">Cancel Edit</button>
</div></div>
<div id="todoList" class="list"></div>
<button id="clearHistoryBtn" class="danger hidden" onclick="clearHistory()">Clear Completed History</button>
<div class="toolbar"><button class="secondary" onclick="exportData()">Export Backup</button><button class="secondary" onclick="document.getElementById('fileInput').click()">Import Backup</button></div>
<input type="file" id="fileInput" accept="application/json,.json" class="hidden" onchange="importData(event)">
<div class="hint">Stored locally on this device. Export a backup before clearing browser site data.</div>
</section></main>
<script>
const STORAGE_KEY='mini_planner_tasks_v2',LEGACY_KEY='myTodos';
const body=document.getElementById('body'),layer=document.getElementById('effect-layer'),dateInput=document.getElementById('dateInput'),timeInput=document.getElementById('timeInput'),taskInput=document.getElementById('taskInput'),categoryInput=document.getElementById('categoryInput');
let currentTab='active',editingId=null,currentSeason='spring',tasks=loadTasks();
function loadTasks(){try{const v=localStorage.getItem(STORAGE_KEY);if(v)return JSON.parse(v);const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'[]');const migrated=Array.isArray(old)?old.map(t=>({...t,completed:false,completedAt:null})):[];if(migrated.length){localStorage.setItem(STORAGE_KEY,JSON.stringify(migrated));localStorage.removeItem(LEGACY_KEY)}return migrated}catch{return[]}}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks))}
function localDate(date,time){if(!date)return new Date(NaN);const d=date.split('-').map(Number),t=(time||'00:00').split(':').map(Number);return new Date(d[0],d[1]-1,d[2],t[0]||0,t[1]||0,0,0)}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function updateSeason(){const d=localDate(dateInput.value,'00:00');const m=Number.isNaN(d.getTime())?new Date().getMonth():d.getMonth();currentSeason=m>=2&&m<=4?'spring':m>=5&&m<=7?'summer':m>=8&&m<=10?'autumn':'winter';body.className=currentSeason}
function switchTab(tab){currentTab=tab;document.getElementById('tabActive').className=tab==='active'?'tab active':'tab';document.getElementById('tabHistory').className=tab==='history'?'tab active':'tab';document.getElementById('editor').classList.toggle('hidden',tab==='history');document.getElementById('clearHistoryBtn').classList.toggle('hidden',tab!=='history');cancelEdit(false);render()}
function saveTask(){const text=taskInput.value.trim(),date=dateInput.value,time=timeInput.value;if(!date||!text){alert('Please add a date and task.');return}if(editingId!==null){const t=tasks.find(x=>x.id===editingId);if(t){t.date=date;t.time=time;t.text=text;t.category=categoryInput.value;t.playedSound=false}}else{tasks.push({id:Date.now(),date,time,text,category:categoryInput.value,completed:false,completedAt:null,playedSound:false})}persist();taskInput.value='';editingId=null;document.getElementById('saveBtn').textContent='Add Task';document.getElementById('cancelEditBtn').classList.add('hidden');document.getElementById('editNote').classList.add('hidden');render();taskInput.focus()}
function editTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;editingId=id;dateInput.value=t.date;timeInput.value=t.time||'';taskInput.value=t.text;categoryInput.value=t.category||'Others';updateSeason();document.getElementById('saveBtn').textContent='Save Changes';document.getElementById('cancelEditBtn').classList.remove('hidden');document.getElementById('editNote').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function cancelEdit(clear=true){editingId=null;document.getElementById('saveBtn').textContent='Add Task';document.getElementById('cancelEditBtn').classList.add('hidden');document.getElementById('editNote').classList.add('hidden');if(clear)taskInput.value=''}
function completeTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.completed=true;t.completedAt=Date.now();persist();render()}
function restoreTask(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.completed=false;t.completedAt=null;t.playedSound=false;persist();render()}
function deleteTask(id){if(!confirm('Delete this task?'))return;tasks=tasks.filter(t=>t.id!==id);persist();render()}
function clearHistory(){if(!confirm('Clear all completed tasks?'))return;tasks=tasks.filter(t=>!t.completed);persist();render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){const now=new Date(),list=document.getElementById('todoList');let sound=false;const shown=tasks.filter(t=>currentTab==='active'?!t.completed:t.completed).sort((a,b)=>currentTab==='active'?localDate(a.date,a.time)-localDate(b.date,b.time):(b.completedAt||0)-(a.completedAt||0));list.innerHTML=shown.map(t=>{const dt=localDate(t.date,t.time),diff=dt-now,isDue=!t.completed&&diff<=0&&diff>-60000,isOverdue=!t.completed&&diff<=-60000;if(isDue&&!t.playedSound&&document.visibilityState==='visible'){t.playedSound=true;sound=true}return `<div class="task ${isDue?'due ':''}${isOverdue?'overdue ':''}${t.completed?'completed':''}"><div><div><b>${esc(t.text)}</b></div><div class="meta">${esc(t.date)}${t.time?' · '+esc(t.time):''}${isOverdue?' · Overdue':''}</div><span class="tag">${esc(t.category||'Others')}</span></div><div class="actions">${t.completed?`<button class="icon" onclick="restoreTask(${t.id})" title="Restore">↩</button>`:`<button class="icon" onclick="completeTask(${t.id})" title="Done">✓</button><button class="icon" onclick="editTask(${t.id})" title="Edit">✎</button>`}<button class="icon" onclick="deleteTask(${t.id})" title="Delete">×</button></div></div>`}).join('')||`<div class="empty">${currentTab==='active'?'No active tasks.':'No completed tasks yet.'}</div>`;if(sound){persist();playSound()}}
function playSound(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(ctx.currentTime+.35)}catch{}}
function exportData(){const payload={app:'mini-planner',version:2,exportedAt:new Date().toISOString(),tasks};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`mini-planner-${todayStr()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(e){const file=e.target.files&&e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result),incoming=Array.isArray(parsed)?parsed:parsed.tasks;if(!Array.isArray(incoming))throw new Error();const cleaned=incoming.filter(t=>t&&t.id&&t.date&&typeof t.text==='string').map(t=>({id:Number(t.id)||Date.now()+Math.random(),date:String(t.date),time:String(t.time||''),text:String(t.text).slice(0,160),category:String(t.category||'Others'),completed:!!t.completed,completedAt:t.completedAt||null,playedSound:!!t.playedSound}));if(!confirm(`Replace current planner with ${cleaned.length} imported task(s)?`))return;tasks=cleaned;persist();render()}catch{alert('That backup file is not valid.')}finally{e.target.value=''}};r.readAsText(file)}
function particlesAllowed(){return !matchMedia('(prefers-reduced-motion: reduce)').matches&&document.visibilityState==='visible'}
function createParticle(){if(!particlesAllowed())return;const p=document.createElement('div'),size=Math.random()*9+5;p.className='particle';if(currentSeason==='summer'){p.classList.add('shining-ball');p.style.cssText+=`bottom:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size}px;transition:transform 4s linear,opacity 4s`;layer.appendChild(p);requestAnimationFrame(()=>{p.style.transform='translateY(-105vh)';p.style.opacity='0'});setTimeout(()=>p.remove(),4100)}else{p.textContent=currentSeason==='spring'?'🌸':currentSeason==='autumn'?'🍂':'❄️';p.style.cssText+=`left:${Math.random()*100}vw;top:-24px;transition:transform 6s linear`;layer.appendChild(p);requestAnimationFrame(()=>p.style.transform='translateY(105vh)');setTimeout(()=>p.remove(),6100)}}
setInterval(createParticle,1200);setInterval(render,30000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')render()});dateInput.value=todayStr();timeInput.value='';updateSeason();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>
</html>
